<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleanly — Nettoyez votre empreinte numérique</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F0F2F5;
      color: #1C1E21;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .hero {
      background: #FFF;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 520px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }
    .badge {
      display: inline-block;
      background: #1877F215;
      color: #1877F2;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { color: #65676B; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">Application Mobile Cleanly</div>
    <h1>Nettoyez vos réseaux sociaux en 1 clic</h1>
    <p>Cleanly supprime vos anciens messages, posts, likes et commentaires en masse sur Discord, Twitter, Reddit et bien d'autres.</p>
  </div>
</body>
</html>
