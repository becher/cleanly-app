<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleanly — Connexion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F0F2F5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1C1E21;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px 24px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #1877F2;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #65676B;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E4E6EB;
      border-top-color: #1877F2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #1877F2;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #166FE5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">C</div>
    <div class="spinner"></div>
    <h1>Connexion en cours</h1>
    <p>Redirection sécurisée vers l'application Cleanly...</p>
    <a id="open-app-btn" href="#" class="btn" style="display: none;">Ouvrir Cleanly</a>
  </div>

  <script>
    const hash = window.location.hash || '';
    const search = window.location.search || '';
    const deepLink = 'cleanly://oauth' + search + hash;

    const btn = document.getElementById('open-app-btn');
    btn.href = deepLink;

    // Redirection automatique immédiate vers l'application native
    window.location.replace(deepLink);

    setTimeout(() => {
      btn.style.display = 'inline-block';
    }, 1200);
  </script>
</body>
</html>
